<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 740" width="1440" height="740" role="img" aria-label="LangGraph's Pregel superstep loop stops on an empty plan, whether the graph reached END or ran out of edges">
<title>LangGraph's Pregel superstep loop stops on an empty plan, whether the graph reached END or ran out of edges</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3a4049"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
</defs>
<rect width="1440" height="740" rx="18" fill="#0d1117"/>
<rect x="40" y="40" width="640" height="660" rx="14" fill="#11161d" stroke="#262a31"/>
<rect x="720" y="40" width="680" height="660" rx="14" fill="#11161d" stroke="#262a31"/>
<text x="360" y="92" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#58a6ff" text-anchor="middle" letter-spacing="2">PREGEL SUPERSTEP LOOP</text>
<text x="1060" y="92" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#58a6ff" text-anchor="middle" letter-spacing="2">TWO ENDINGS, ONE EMPTY PLAN</text>
<rect x="160.0" y="120" width="440" height="96" rx="10" fill="#0f1d33" stroke="#58a6ff" stroke-width="1.5"/><text x="380.0" y="163.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3" text-anchor="middle" >Plan</text><text x="380.0" y="194.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="middle" >pick nodes whose triggers changed</text>
<line x1="380" y1="216" x2="380" y2="256" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrM)"/>
<path d="M380 258 L520 316 L380 374 L240 316 Z" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
<text x="380" y="311" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3" text-anchor="middle" >any node</text>
<text x="380" y="337" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3" text-anchor="middle" >to run?</text>
<line x1="380" y1="374" x2="380" y2="428" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrM)"/>
<text x="394" y="406" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#3fb950" text-anchor="start" >yes</text>
<rect x="160.0" y="430" width="440" height="96" rx="10" fill="#161b22" stroke="#262a31" stroke-width="1.5"/><text x="380.0" y="473.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3" text-anchor="middle" >Execute</text><text x="380.0" y="504.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="middle" >run the selected nodes</text>
<line x1="380" y1="526" x2="380" y2="556" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrM)"/>
<rect x="160.0" y="558" width="440" height="96" rx="10" fill="#161b22" stroke="#262a31" stroke-width="1.5"/><text x="380.0" y="601.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3" text-anchor="middle" >Update channels</text><text x="380.0" y="632.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="middle" >apply the nodes' writes</text>
<path d="M160.0 606 H100 V168 H157.0" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrM)"/>
<text x="80" y="387" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#8b949e" text-anchor="middle" transform="rotate(-90 80 387)">next superstep</text>
<line x1="520" y1="316" x2="848" y2="316" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrM)"/>
<text x="540" y="302" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f85149" text-anchor="start" >no</text>
<rect x="750" y="120" width="300" height="96" rx="10" fill="#0f2318" stroke="#1f5f33" stroke-width="1.5"/><text x="900.0" y="163.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#3fb950" text-anchor="middle" >Reached END</text><text x="900.0" y="194.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="middle" >last write went to __end__</text>
<rect x="1070" y="120" width="300" height="96" rx="10" fill="#2a1215" stroke="#6e2a2a" stroke-width="1.5"/><text x="1220.0" y="163.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#f85149" text-anchor="middle" >Ran out of edges</text><text x="1220.0" y="194.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="middle" >dead-end node, nothing next</text>
<path d="M900 216 V228 Q900 238 910 238 H1000 V266.0" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrG)"/>
<path d="M1220 216 V228 Q1220 238 1210 238 H1120 V266.0" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrR)"/>
<rect x="850" y="268.0" width="420" height="96" rx="10" fill="#0f1d33" stroke="#58a6ff" stroke-width="1.5"/><text x="1060.0" y="311.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3" text-anchor="middle" >Empty plan</text><text x="1060.0" y="342.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="middle" >no node is triggered next</text>
<line x1="1060.0" y1="364.0" x2="1060.0" y2="428" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrM)"/>
<rect x="850" y="430" width="420" height="96" rx="10" fill="#161b22" stroke="#262a31" stroke-width="1.5"/><text x="1060.0" y="473.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3" text-anchor="middle" >Run ends normally</text><text x="1060.0" y="504.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="middle" >state returned · no exception</text>
<rect x="750" y="558" width="620" height="96" rx="10" fill="none" stroke="#262a31" stroke-dasharray="6 6"/>
<text x="1060" y="597" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8b949e" text-anchor="middle" >No separate state for</text>
<text x="1060" y="627" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#e6edf3" text-anchor="middle" >“finished correctly” vs “stuck”</text>
</svg>
